<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Styled Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
    }

    /* Table container */
    .table-container {
      display: flex;
      justify-content: center;
    }

    table {
      width: 80%;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    th, td {
      padding: 15px;
      text-align: center;
    }

    th {
      background: #3498db;
      color: white;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    tr {
      border-bottom: 1px solid #eee;
    }

    tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tr:hover {
      background-color: #eaf4ff;
      transition: 0.3s;
    }

    td {
      color: #333;
    }

    /* Responsive */
    @media (max-width: 600px) {
      table {
        width: 100%;
        font-size: 14px;
      }

      th, td {
        padding: 10px;
      }
    }

  </style>
</head>

<body>

  <h2>Student Table</h2>

  <div class="table-container">
    <table>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Course</th>
        <th>Marks</th>
      </tr>

      <tr>
        <td>1</td>
        <td>Arya</td>
        <td>HTML</td>
        <td>85</td>
      </tr>

      <tr>
        <td>2</td>
        <td>Ravi</td>
        <td>CSS</td>
        <td>90</td>
      </tr>

      <tr>
        <td>3</td>
        <td>Meena</td>
        <td>JavaScript</td>
        <td>88</td>
      </tr>

      <tr>
        <td>4</td>
        <td>John</td>
        <td>Python</td>
        <td>92</td>
      </tr>

    </table>
  </div>

</body>
</html>
